<title>Kettle &amp; Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/*__STYLES__*/
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" aria-label="Home: today's workout" title="Today's workout">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="var(--accent)"/><rect x="86" y="160" width="340" height="22" rx="11" fill="var(--accent-soft)"/><g fill="none" stroke="var(--bg)" stroke-linecap="round" stroke-linejoin="round"><polyline points="184,171 146,246 214,226" stroke-width="30"/><polyline points="328,171 366,246 298,226" stroke-width="30"/><line x1="256" y1="222" x2="256" y2="318" stroke-width="66"/><polyline points="238,322 222,372 238,420" stroke-width="32"/><polyline points="274,322 290,372 274,420" stroke-width="32"/></g><circle cx="256" cy="136" r="40" fill="var(--bg)"/></svg>
      <span class="bname">Kettle &amp; Bar</span>
    </button>
    <nav class="nav" aria-label="Main">
      <button data-go="programs">Programs</button>
      <button data-go="library">Exercises</button>
      <button data-go="stats">Stats</button>
    </nav>
    <button class="sync" id="sync" data-s="local" disabled><i></i><span>Saved on this device</span></button>
    <button class="gear" data-go="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div class="acct" id="acct" hidden><div id="acctwho"></div><p>Progress syncs to every device where you sign in.</p><button class="btn ghost" id="signout">Sign out</button></div>
  </div>
</header>
<main id="app" class="wrap" aria-live="polite"></main>
<!-- outside #app so a redraw while the picker is open (e.g. a sync update) cannot replace it -->
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div class="bgt" id="bgt" hidden role="dialog" aria-modal="true" aria-label="Big timer">
  <button class="btx" id="btx" aria-label="Close big timer">✕</button>
  <div class="btfig" id="btfig" hidden aria-hidden="true"></div>
  <div class="btmain">
    <div class="bttime num" id="bttime" role="timer" aria-live="off">0:30</div>
    <div class="btlabel" id="btlabel">Rest timer</div>
    <div class="btsub" id="btsub"></div>
    <div class="btnext" id="btnext" hidden>Next: <b id="btnextl"></b></div>
    <div class="bthint">Tap anywhere to close</div>
  </div>
</div>
<div class="timer" id="timer" hidden>
  <div class="wrap">
    <div class="tfig" id="tfig" hidden aria-hidden="true"></div>
    <button class="tclock num" id="tclock" aria-label="Start or pause rest timer">0:30</button>
    <div class="tinfo"><b id="tlabel">Rest timer</b><span id="tsub">Tap a set number when you finish a set</span></div>
    <div class="tctl">
      <button id="tgo" class="go">Start</button>
      <button id="treset" aria-label="Reset timer">Reset</button>
      <button id="tbt" aria-label="Open big timer" data-bt hidden>⛶</button>
    </div>
    <div class="tadj">
      <button data-adj="-15" aria-label="Minus 15 seconds">−15s</button>
      <button data-adj="15" aria-label="Plus 15 seconds">+15s</button>
      <span id="presets"></span>
      <span class="sep"></span>
      <span class="sess num">Workout <b id="sess">0:00</b></span>
      <button id="sessreset" aria-label="Reset workout clock">↺</button>
    </div>
  </div>
</div>
