# Nightly backup of every account's progress to the private noamros9/kettle-bar-backup repo (ADR 5).
# The Firebase key is read-only; git history in the backup repo keeps every version. Restore = Settings → Import.
name: Nightly backup
on:
  schedule:
    - cron: '17 1 * * *' # 04:17 in Israel (summer time), 03:17 in winter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the Firebase admin library
        run: npm install --no-save --ignore-scripts firebase-admin@12
      - name: Read progress from Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup-progress.js > progress.json
      - uses: actions/checkout@v7
        with:
          repository: noamros9/kettle-bar-backup
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup
      - name: Commit only if something changed
        run: |
          cp progress.json backup/progress.json
          cd backup
          git add progress.json
          if git diff --cached --quiet; then echo "No change since the last backup."; exit 0; fi
          git config user.name "kettle-bar backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Backup $(date -u +%F)"
          git push
