# Build, test, and deploy to GitHub Pages only when every test passes (ADR 4).
name: Test and deploy
# Markdown-only changes (plans, docs, roadmap) ship nothing and no test reads them: no run, no deploy
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read # tested-tree.js reads the PR's run (decision 128)
  pull-requests: read
  pages: write
  id-token: write

# a newer push to the same PR cancels the older run; main's runs (they deploy) always finish
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the library once and saves the build cache, so the test and UI jobs read it instead of each building cold
  # at the same time (a builder change made three 8-10 minute builds per PR run, 15 Oct 2026). No Playwright image:
  # the build needs no browser, and the plain runner starts faster. A pin failure doesn't stop it here: the cache is
  # written before the pin gate, and the test job's own build reports the failure as before.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tree this run tests
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Did this exact tree already pass?
        id: passed
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .tested-tree
          key: tested-${{ steps.tree.outputs.tree }}
          lookup-only: true
      - uses: actions/setup-node@v7
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.passed.outputs.cache-hit != 'true'
      - name: Restore the build cache
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build-cache
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-
      - name: Build once for the jobs after it
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm run build | tee build.log && grep '^build cache' build.log | sed 's/^/::notice title=Build cache::/'
        shell: bash
      - uses: actions/cache/save@v4
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .build-cache
          key: build-cache-pre-${{ github.run_id }}

  test:
    needs: build
    runs-on: ubuntu-24.04
    # Playwright's own image has the browser and its system libraries: no install step (it took 6 to 20+ minutes
    # of apt-get). Its version must match @playwright/test in package.json (tests/ci.test.js checks).
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      # Noam, 10 Oct 2026: a PR run on a tree that already passed on this PR (a rebase that changed no file) tests nothing
      - name: The tree this run tests
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Did this exact tree already pass?
        id: passed
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .tested-tree
          key: tested-${{ steps.tree.outputs.tree }}
          lookup-only: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        if: steps.passed.outputs.cache-hit != 'true'
      # Decision 128: a push whose tree a green PR run already tested only builds and deploys
      - name: Was this tree tested on its PR?
        id: tested
        if: github.event_name == 'push'
        run: node scripts/tested-tree.js
        env:
          GH_TOKEN: ${{ github.token }}
      # the build cache (decision 326): programs and recipe trials whose keys are unchanged are read, not made; restored
      # before the unit tests too, whose shared library comes through it (Phase 24 ticket 10)
      - name: Restore the build cache
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build-cache
          key: build-cache-pre-${{ github.run_id }}
          restore-keys: build-cache-
      - name: Unit tests, 100% coverage on the core modules
        if: steps.tested.outputs.tested != 'true' && steps.passed.outputs.cache-hit != 'true'
        run: npm run test:coverage 2>&1 | tee unit.log; exit ${PIPESTATUS[0]}
        shell: bash
      # each failing test (and a coverage shortfall) as an annotation on the PR, readable without the raw log
      - name: Name the failures
        if: failure()
        run: node scripts/unit-failures.js unit.log
      - name: Build
        if: steps.passed.outputs.cache-hit != 'true'
        run: npm run build | tee build.log && grep '^build cache' build.log | sed 's/^/::notice title=Build cache::/'
        shell: bash
      # decision 327: main's run also builds cold, from no cache, and the two builds must match byte for byte
      - name: A cold build matches the cached one
        if: github.event_name == 'push' && steps.passed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/warm" && cp -r index.html version.json data "$RUNNER_TEMP/warm/"
          KB_BUILD_CACHE="$RUNNER_TEMP/cold-cache" node build.js --cold
          if ! diff -rq "$RUNNER_TEMP/warm/data" data > diff.txt || ! cmp -s "$RUNNER_TEMP/warm/index.html" index.html || ! cmp -s "$RUNNER_TEMP/warm/version.json" version.json; then
            echo "::error title=Build cache::the cached build differs from a cold one"; head -20 diff.txt; exit 1
          fi
          echo "::notice title=Build cache::the cold build matches the cached one"
      # files no build has read or written for 14 days go before the cache is saved (a hit refreshes a file's time)
      - name: Save the build cache
        if: success() && steps.passed.outputs.cache-hit != 'true'
        shell: bash
        run: find .build-cache -type f -mtime +14 -delete
      - uses: actions/cache/save@v4
        if: success() && steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .build-cache
          key: build-cache-${{ github.run_id }}
      - name: Library size (decision 317; the cloud machine builds no whole library, so CI measures it)
        if: steps.passed.outputs.cache-hit != 'true'
        run: npm run size | tee size.txt && sed 's/^/::notice title=Library size::/' size.txt
      - name: Collect the site
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          mkdir _site
          cp -r index.html version.json data fonts manifest.webmanifest sw.js icons firebase-config.js firebase-sync.js _site/
      - name: Serve the Firebase library with the app (offline sign-in and sync)
        if: steps.passed.outputs.cache-hit != 'true'
        run: node scripts/vendor-firebase.js _site
      - name: Serve the Program finder's model with the app (pinned, every file's hash checked)
        if: steps.passed.outputs.cache-hit != 'true'
        run: node scripts/vendor-finder.js _site
      # Phase 24 ticket 10: the smoke (98 s) on main always, on a PR only when a changed file can touch the finder
      - name: Does this change touch the finder?
        id: finder
        if: steps.passed.outputs.cache-hit != 'true'
        run: node scripts/finder-needed.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The finder's model loads in Chromium from our own site, understands a question, and makes the program vectors
        if: steps.passed.outputs.cache-hit != 'true' && steps.finder.outputs.needed == 'true'
        run: node scripts/finder-smoke.js _site
      - uses: actions/upload-pages-artifact@v5
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          path: _site

  # Decision 131: the phone tests, light and dark, each in its own job beside the unit tests
  ui:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v7
      # Noam, 10 Oct 2026: a PR run on a tree that already passed on this PR (a rebase that changed no file) tests nothing
      - name: The tree this run tests
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Did this exact tree already pass?
        id: passed
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .tested-tree
          key: tested-${{ steps.tree.outputs.tree }}
          lookup-only: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        if: steps.passed.outputs.cache-hit != 'true'
      - name: Was this tree tested on its PR?
        id: tested
        if: github.event_name == 'push'
        run: node scripts/tested-tree.js
        env:
          GH_TOKEN: ${{ github.token }}
      # the build cache (decision 326): programs and recipe trials whose keys are unchanged are read, not made; the
      # build job's, so this build reads what it made
      - name: Restore the build cache
        if: steps.tested.outputs.tested != 'true' && steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build-cache
          key: build-cache-pre-${{ github.run_id }}
          restore-keys: build-cache-
      # Decision 307: build in its own step; the test server then only serves (the build inside its start timed out)
      - name: Build
        if: steps.tested.outputs.tested != 'true' && steps.passed.outputs.cache-hit != 'true'
        run: npm run build
      - name: Phone UI tests
        if: steps.tested.outputs.tested != 'true' && steps.passed.outputs.cache-hit != 'true'
        run: npx playwright test --project=phone-${{ matrix.theme }}
        env:
          UI_PREBUILT: '1'
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-screenshots-${{ matrix.theme }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  deploy:
    needs: [test, ui]
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # a PR run whose unit and UI jobs passed records its tree, so a later run on the same tree skips its tests
  mark:
    needs: [test, ui]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tree this run tested
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - run: echo passed > .tested-tree
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .tested-tree
          key: tested-${{ steps.tree.outputs.tree }}
