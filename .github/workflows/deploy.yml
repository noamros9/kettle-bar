# Build, test, and deploy to GitHub Pages only when every test passes (ADR 4).
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests, 100% coverage on the core modules
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Install the phone browser
        run: npx playwright install --with-deps chromium
      - name: Phone UI tests, light and dark
        run: npm run test:ui
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons firebase-config.js firebase-sync.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
