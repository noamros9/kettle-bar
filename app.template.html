<title>Kettle &amp; Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#16181B; --muted:#5B6268; --line:#D6DAD5; --soft:#E3E6E1;
  --accent:#2346D5; --accent-ink:#FFFFFF; --accent-soft:#DCE3FB;
  --t-cba:#2346D5; --t-up:#B96500; --t-low:#A63C2A; --t-ac:#0B8672;
  --fig:#16181B; --fig-far:#9097A0; --kit:#2346D5; --prop:#A3AAB0; --mat:#D3DBF6; --ground:#C9CEC9;
  --mm-body:#DCDFDA; --mm-off:#C5C9C3; --mm-line:#EEF0EC; --mm-sec:#93A6F0;
  --done-bg:#16181B; --done-ink:#EEF0EC;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101214; --surface:#191C1F; --ink:#ECEEEA; --muted:#9AA2A8; --line:#2B3034; --soft:#22262A;
    --accent:#7F97FF; --accent-ink:#0E1330; --accent-soft:#232C52;
    --t-cba:#7F97FF; --t-up:#F0A23C; --t-low:#EE7A62; --t-ac:#38C9AE;
    --fig:#ECEEEA; --fig-far:#6D757C; --kit:#7F97FF; --prop:#5E666C; --mat:#27305A; --ground:#343A3F; --mm-body:#2A2F33; --mm-off:#3A4045; --mm-line:#101214; --mm-sec:#3E4E8F;
    --done-bg:#ECEEEA; --done-ink:#101214;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101214; --surface:#191C1F; --ink:#ECEEEA; --muted:#9AA2A8; --line:#2B3034; --soft:#22262A;
  --accent:#7F97FF; --accent-ink:#0E1330; --accent-soft:#232C52;
  --t-cba:#7F97FF; --t-up:#F0A23C; --t-low:#EE7A62; --t-ac:#38C9AE;
  --fig:#ECEEEA; --fig-far:#6D757C; --kit:#7F97FF; --prop:#5E666C; --mat:#27305A; --ground:#343A3F; --mm-body:#2A2F33; --mm-off:#3A4045; --mm-line:#101214; --mm-sec:#3E4E8F;
  --done-bg:#ECEEEA; --done-ink:#101214;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:54px}
.brand{white-space:nowrap;font:800 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;padding:8px 10px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:0;padding:6px 8px;border-radius:999px}
.sync:not(:disabled):hover{background:var(--soft)}
.sync:disabled{cursor:default}
.sync[data-s="signin"]{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:7px 12px}
.sync[data-s="signin"] i{display:none}
.sync[data-s="err"] i,.sync[data-s="offline"] i{background:var(--t-low)}
.top .wrap{position:relative}
.acct{position:absolute;right:16px;top:52px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(280px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:8px}
.acct #acctwho{font-weight:700;overflow-wrap:anywhere}
.acct p{margin:0;font-size:13px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--t-ac)}
.sync[data-s="saving"] i{background:var(--t-up)}
@media (max-width:560px){.sync:not([data-s="signin"]) span{display:none}}

/* shared type */
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(40px,8vw,72px)/.92 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:6px 0 10px;text-wrap:balance}
h2{font:800 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.lede{color:var(--muted);max-width:62ch;margin:0}
main{padding-block:24px 64px}

/* program */
.phead{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
@media (max-width:760px){.phead{grid-template-columns:1fr}}
.progress{min-width:250px}
.progress .big{font:800 44px/1 var(--display)}
.progress .big small{font-size:22px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.cycle{display:flex;flex-wrap:wrap;gap:8px 20px;margin:22px 0 6px;padding:14px 0;border-block:1px solid var(--line);font-size:14px}
.cycle div{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.cycle .days{color:var(--muted)}
.nextup{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0 8px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.nextup .t{flex:1;min-width:200px}
.nextup .t b{font:800 26px/1.05 var(--display);text-transform:uppercase;display:block}
.nextup .t span{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.done{background:var(--done-bg);color:var(--done-ink)}
.level{margin-top:30px}
.level header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.level header p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:112px}
.tile .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 10px 10px 11px;height:100%;box-sizing:border-box;border-radius:8px}
.tile .open:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .n{font:800 34px/1 var(--display)}
.tile .nm{font-weight:600;font-size:13px;line-height:1.2;margin-top:2px}
.tile .ty{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.tile .ty .dot{width:8px;height:8px}
.tile .chk{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.tile .chk svg{width:14px;height:14px;opacity:0}
.tile.done{background:var(--done-bg);border-color:var(--done-bg);color:var(--done-ink)}
.tile.done .ty{color:var(--done-ink);opacity:.75}
.tile.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.done .chk svg{opacity:1}
.tile.next{border:2px solid var(--accent)}
.tile.next::after{content:"Next";position:absolute;bottom:9px;right:10px;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

/* programs list */
.plist{display:grid;gap:12px;margin-top:20px}
.pcard{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:left;width:100%}
.pcard b{font:800 30px/1 var(--display);text-transform:uppercase;display:block;margin-bottom:6px}
.pcard p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.pcard .num{font:800 30px/1 var(--display)}
.soon{margin-top:14px;padding:16px 18px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}

/* workout */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.crumbs .back{background:none;border:0;padding:6px 0;font-weight:600;color:var(--muted)}
.crumbs .step{margin-left:auto;display:flex;gap:6px}
.crumbs .step button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.crumbs .step button:disabled{opacity:.35;cursor:default}
.whead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-bottom:18px;border-bottom:3px solid var(--ink)}
@media (max-width:640px){.whead{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:15px;align-items:center}
.meta .ty{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600}
.how{margin:16px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.block{margin-top:30px}
.bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.bletter{width:40px;height:40px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 24px/1 var(--display)}
.bhead .bt{flex:1;min-width:180px}
.bhead .bt h2{font-size:26px}
.bhead .bt div{color:var(--muted);font-size:14px}
.pips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pips .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.ex .pips{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);gap:5px}
.ex .pips .lbl{display:none}
.ex .pip{width:32px;height:32px;font-size:15px}
.ex.fin{border-color:var(--accent)}
.workbtn{margin-top:auto;border:0;border-radius:8px;padding:9px 10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;text-align:center}
.workbtn + .pips{margin-top:8px}
.timer.work{background:var(--accent-soft)}
.timer.work .tclock{color:var(--accent)}
.pip{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:700 16px/1 var(--display);display:grid;place-items:center;padding:0}
.pip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px}
.ex .figbox{height:130px;display:flex;align-items:center;justify-content:center}
.fig{max-width:100%;max-height:130px;height:auto;width:auto}
.ex .cnt{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.ex .cnt b{font:800 38px/1 var(--display)}
.ex .cnt span{font-weight:600;color:var(--muted);font-size:14px}
.ex .nm{font:700 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ex .ld{font-size:12px;font-weight:600;color:var(--kit);display:flex;align-items:center;gap:5px}
.ex .cue{font-size:13px;color:var(--muted);margin:0}
.ex .ord{font:700 12px/1 var(--display);color:var(--muted);letter-spacing:.1em}
.between{margin-top:26px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.between::before,.between::after{content:"";flex:1;height:1px;background:var(--line)}
.complete{margin-top:28px;padding:18px;border-radius:10px;background:var(--accent-soft);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.complete p{margin:0;flex:1;min-width:200px;font-weight:600}
.note{margin-top:28px;font-size:13px;color:var(--muted);max-width:70ch}

/* library */
.libcat{margin-top:30px}
.exlink{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:8px}
.exlink:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.exlink .nm{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:2px}
.exlink:hover .nm{text-decoration-color:var(--accent)}
.more{font-size:12px;font-weight:700;color:var(--accent)}
.stretch .exgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.stretch .ex .figbox{height:92px}.stretch .fig{max-height:92px}
.stretch .ex .cnt b{font-size:28px}.stretch .ex .nm{font-size:17px}
.bletter.soft{background:var(--soft);color:var(--ink)}
.runbtn{border:0;border-radius:10px;padding:11px 16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px}
.runbtn.done{background:var(--accent);color:var(--accent-ink)}
.expage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px}
@media (max-width:760px){.expage{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:22px;margin-bottom:10px}
.bigfig{display:flex;justify-content:center;padding:8px 0 4px}
.bigfig .fig{max-height:210px;width:100%}
.facts{display:grid;gap:10px;margin-top:14px}
.facts div{display:flex;gap:10px;font-size:15px}
.facts dt{min-width:92px;color:var(--muted);font-weight:600}
.facts dd{margin:0}
.mm{width:100%;max-width:440px;display:block;margin:0 auto}
.mm-body{fill:var(--mm-body)}
.mm-o,.mm-p,.mm-s{stroke:var(--mm-line);stroke-width:1.2}
.mm-o{fill:var(--mm-off)}.mm-p{fill:var(--accent)}.mm-s{fill:var(--mm-sec)}
.mm-t{font:700 16px var(--body);fill:var(--muted)}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.legend .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend .key{width:14px;height:14px;border-radius:4px;flex:none}
.legend .lab{font-size:13px;font-weight:700;color:var(--muted);min-width:44px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daychips button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:40px;height:34px;font:700 15px/1 var(--display)}
.libcat h2{margin-bottom:12px}

/* programs library */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgroup{margin-top:28px}
.pgroup h2{margin-bottom:10px}
.pgroup .plist{margin-top:0;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media (max-width:420px){.pgroup .plist{grid-template-columns:1fr}}
.pcard{align-items:start}
.pcard.current{border:2px solid var(--accent)}
.eyebrow.cur{color:var(--accent)}
.pcard .pc-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.pcard .pc-main b{margin:2px 0}
.pc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pc-tags .chip{font-size:12px;padding:3px 9px}
.pc-prog{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:64px}
.pc-prog .num{font:800 22px/1 var(--display)}
.pc-prog .bar{width:64px;margin:0}
.gear{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--t-up)}
.progchip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
/* formats */
.bletter.abs{font-size:15px}
.fmt{display:inline-block;vertical-align:middle;margin-left:6px;font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:5px 8px;border-radius:6px}
.pair{margin-bottom:14px}
.pairhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.pairhead b{font:800 20px/1 var(--display);text-transform:uppercase}
.blockpips{margin:0}
.notechip{align-self:flex-start;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:6px}
.counter{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--surface)}
.counter button{width:38px;height:38px;border-radius:8px;border:0;background:var(--soft);font-size:20px;font-weight:700}
.counter span{min-width:84px;text-align:center;font-size:14px;color:var(--muted)}
.counter b{font:800 22px/1 var(--display);color:var(--ink)}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.timer .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;padding-block:10px}
.tclock{font:800 52px/1 var(--display);letter-spacing:.01em;min-width:3.3ch;background:none;border:0;padding:0;text-align:left}
.tclock.zero{color:var(--accent)}
.tinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.tinfo b{font:700 15px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo span{font-size:13px;color:var(--muted)}
.tctl{display:flex;gap:6px}
.tctl button{height:46px;min-width:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;padding:0 12px}
.tctl .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:86px}
.tadj{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tadj button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.tadj button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tadj .sep{flex:1}
.tadj .sess{font-size:13px;color:var(--muted)}
.tadj .sess b{color:var(--ink)}
body.has-timer main{padding-bottom:170px}
@media (max-width:520px){
  .brand{font-size:18px}.nav button{padding:8px 6px;font-size:13px}.top .wrap{gap:8px}.sync:not([data-s="signin"]) span{display:none}.sync[data-s="signin"]{padding:6px 9px;font-size:11px}
  .ex{padding:10px}.ex .figbox{height:100px}.fig{max-height:100px}.ex .cnt b{font-size:32px}.ex .nm{font-size:18px}
  .timer .wrap{padding-block:8px;gap:6px 10px}
  .tclock{font-size:42px}.tctl .go{min-width:70px}.tctl button{padding:0 10px;height:42px}
  #tsub{display:none}
  .tadj{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tadj button,.tadj .sess{flex:none}
  .tadj .sep{display:none}
  #presets{display:flex;gap:6px;flex:none}
  body.has-timer main{padding-bottom:140px}
}
@media (max-width:430px){.bname{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" aria-label="Kettle and Bar home">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="var(--accent)"/><rect x="86" y="160" width="340" height="22" rx="11" fill="var(--accent-soft)"/><g fill="none" stroke="var(--bg)" stroke-linecap="round" stroke-linejoin="round"><polyline points="184,171 146,246 214,226" stroke-width="30"/><polyline points="328,171 366,246 298,226" stroke-width="30"/><line x1="256" y1="222" x2="256" y2="318" stroke-width="66"/><polyline points="238,322 222,372 238,420" stroke-width="32"/><polyline points="274,322 290,372 274,420" stroke-width="32"/></g><circle cx="256" cy="136" r="40" fill="var(--bg)"/></svg>
      <span class="bname">Kettle &amp; Bar</span>
    </button>
    <nav class="nav" aria-label="Main">
      <button data-go="programs">Programs</button>
      <button data-go="library">Exercises</button>
    </nav>
    <button class="sync" id="sync" data-s="local" disabled><i></i><span>Saved on this device</span></button>
    <div class="acct" id="acct" hidden><div id="acctwho"></div><p>Progress syncs to every device where you sign in.</p><button class="btn ghost" id="signout">Sign out</button></div>
  </div>
</header>
<main id="app" class="wrap" aria-live="polite"></main>
<div class="timer" id="timer" hidden>
  <div class="wrap">
    <button class="tclock num" id="tclock" aria-label="Start or pause rest timer">0:30</button>
    <div class="tinfo"><b id="tlabel">Rest timer</b><span id="tsub">Tap a set number when you finish a set</span></div>

    </div>

      <button data-adj="15" aria-label="Plus 15 seconds">+15s</button>

      <span class="sep"></span>

      <button id="sessreset" aria-label="Reset workout clock">↺</button>
    </div>
  </div>
</div>

<script>
/*__LIB__*/
</script>
<script>
const PROGRAMS = [/*__PROGRAM__*/];
const { EX, LOAD, MUSCLE_NAMES, figureSVG, muscleMapSVG } = window.KB;
const TYPES = {
  cba: { label: 'Chest, back & abs', short: 'Chest · Back', c: 'var(--t-cba)', days: 'Days 1, 4, 7…' },
  up:  { label: 'Full body · upper focus', short: 'Upper body', c: 'var(--t-up)', days: 'Days 2, 8, 14…' },
  low: { label: 'Full body · lower focus', short: 'Lower body', c: 'var(--t-low)', days: 'Days 5, 11, 17…' },
  ac:  { label: 'Abs & cardio', short: 'Abs · Cardio', c: 'var(--t-ac)', days: 'Days 3, 6, 9…' },
};
const CAT = { chest: 'Chest', back: 'Back', abs: 'Abs', cardio: 'Cardio', upper: 'Shoulders & arms', full: 'Total body', lower: 'Legs & glutes', warmup: 'Warm-up', cooldown: 'Cool-down stretches' };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const figCache = {};
const fig = (id) => figCache[id] || (figCache[id] = figureSVG(EX[id], EX[id].name + ' illustration'));
const LETTERS = 'ABCDEF';
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------------- storage: device copy + optional synced remote ----------------
   A remote is { kind, subscribe(pid, onData, onErr) -> unsubscribe, write(pid, body) -> Promise, account? }.
   The claude.ai artifact attaches its built-in database; the GitHub Pages build attaches Firebase
   (firebase-sync.js) after Google sign-in. */
const store = {
  remote: null, unsubs: [], seen: {}, done: {}, queue: Promise.resolve(), readonly: false, auth: null,
  key: (pid) => 'kb-progress-' + pid,
  loadLocal() {
    PROGRAMS.forEach((p) => { try { this.done[p.id] = JSON.parse(localStorage.getItem(this.key(p.id)) || '{}') || {}; } catch (e) { this.done[p.id] = {}; } });
  },
  saveLocal(pid) { try { localStorage.setItem(this.key(pid), JSON.stringify(this.done[pid])); } catch (e) {} },
  async init() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) this.attach({
      kind: 'claude',
      subscribe: (pid, onData, onErr) => db.doc('progress/' + pid).onSnapshot((snap) => onData(snap.exists ? (snap.data().done || {}) : null), onErr),
      write: (pid, body) => db.doc('progress/' + pid).set(body),
    });
    else if (!this.remote) setSync(this.auth ? 'signin' : 'local');
  },
  attach(remote) {
    this.detach(true);
    this.remote = remote; this.seen = {}; this.readonly = false; setSync('ok');
    PROGRAMS.forEach((p) => {
      this.unsubs.push(remote.subscribe(p.id, (r) => this.onRemote(p.id, r), (e) => { console.warn('sync error', e); setSync('err'); }));
    });
  },
  detach(silent) {
    this.unsubs.forEach((u) => { try { u(); } catch (e) {} });
    this.unsubs = []; this.remote = null;
    if (!silent) setSync(this.auth ? 'signin' : 'local');
  },
  onRemote(pid, r) {
    if (!this.seen[pid]) {
      // first contact: keep every day ticked on either side
      this.seen[pid] = true;
      const merged = { ...(r || {}) };
      Object.entries(this.done[pid] || {}).forEach(([d, t]) => { if (!merged[d] || t < merged[d]) merged[d] = t; });
      this.done[pid] = merged; this.saveLocal(pid);
      if (!r || Object.keys(merged).length !== Object.keys(r).length) this.write(pid);
    } else {
      this.done[pid] = { ...(r || {}) }; this.saveLocal(pid);
    }
    rerender();
  },
  isDone(pid, day) { return !!(this.done[pid] || {})[day]; },
  count(pid) { return Object.keys(this.done[pid] || {}).length; },
  toggle(pid, day) {
    const d = { ...(this.done[pid] || {}) };
    if (d[day]) delete d[day]; else d[day] = new Date().toISOString();
    this.done[pid] = d; this.saveLocal(pid);
    if (this.remote && !this.readonly) this.write(pid);
    rerender();
  },
  write(pid) {
    const remote = this.remote; if (!remote) return;
    setSync(navigator.onLine === false ? 'offline' : 'saving');
    this.queue = this.queue.then(async () => {
      const body = { done: { ...(this.done[pid] || {}) }, updatedAt: new Date().toISOString() };
      try { await remote.write(pid, body); if (this.remote === remote) setSync('ok'); }
      catch (e) {
        const code = e && e.code;
        if (code === 'unavailable') { await new Promise((r) => setTimeout(r, 600 + Math.random() * 800)); try { await remote.write(pid, body); setSync('ok'); return; } catch (e2) {} }
        if (code === 'invalid_argument' || code === 'permission-denied') { this.readonly = true; setSync('ro'); } else setSync('err');
      }
    });
  },
};
const SYNC_TEXT = { ok: 'Synced', saving: 'Saving…', offline: 'Offline, will sync', local: 'Saved on this device', signin: 'Sign in to sync', ro: 'View only', err: 'Sync problem' };
function setSync(s) {
  const el = $('#sync'); el.dataset.s = s;
  const who = s === 'ok' && store.remote && store.remote.account ? ' · ' + store.remote.account.name : '';
  $('span', el).textContent = (SYNC_TEXT[s] || '') + who;
  el.disabled = !(store.auth);
  el.title = s === 'signin' ? 'Sign in with Google to sync your progress across devices' : '';
}
window.addEventListener('online', () => { if ($('#sync').dataset.s === 'offline') setSync('saving'); });
/* hooks for the Firebase module (GitHub Pages build) */
window.kbSync = {
  attach: (remote) => store.attach(remote),
  detach: () => store.detach(),
  setAuth: (auth) => { store.auth = auth; if (!store.remote) setSync('signin'); else setSync($('#sync').dataset.s); },
};
$('#sync').addEventListener('click', (e) => {
  e.stopPropagation();
  const a = store.auth; if (!a) return;
  if (!store.remote) { a.signIn(); return; }
  const pop = $('#acct'); pop.hidden = !pop.hidden;
  if (!pop.hidden) $('#acctwho').textContent = (store.remote.account && store.remote.account.email) || 'Signed in';
});
document.addEventListener('click', (e) => { const pop = $('#acct'); if (!pop.hidden && !e.target.closest('#acct')) pop.hidden = true; });
$('#signout').addEventListener('click', () => { $('#acct').hidden = true; store.auth && store.auth.signOut(); });
let rerenderQueued = false;
function rerender() {
  if (rerenderQueued) return; rerenderQueued = true;
  requestAnimationFrame(() => { rerenderQueued = false; const y = window.scrollY; render(); window.scrollTo(0, y); });
}

/* ---------------- routing ----------------
   #programs · #exercises · #ex-<id> · #p-<pid> · #p-<pid>-d<n>   (#d<n> = Three-Split 60, kept for old links) */
const PBYID = Object.fromEntries(PROGRAMS.map((p) => [p.id, p]));
const lastPid = () => { try { const v = localStorage.getItem('kb-last-program'); return PBYID[v] ? v : null; } catch (e) { return null; } };
const rememberPid = (pid) => { try { localStorage.setItem('kb-last-program', pid); } catch (e) {} };
let route = { view: 'program', pid: PROGRAMS[0].id, day: null };
function parseHash() {
  const h = location.hash.replace('#', '');
  if (h === 'programs') return { view: 'programs' };
  if (h === 'exercises') return { view: 'library' };
  const x = h.match(/^ex-([a-z0-9_]+)$/);
  if (x && EX[x[1]]) return { view: 'exercise', ex: x[1], pid: route.pid };
  const pd = h.match(/^p-([a-z0-9-]+)-d(\d+)$/);
  if (pd && PBYID[pd[1]]) return { view: 'day', pid: pd[1], day: +pd[2] };
  const pp = h.match(/^p-([a-z0-9-]+)$/);
  if (pp && PBYID[pp[1]]) return { view: 'program', pid: pp[1] };
  const m = h.match(/^d(\d+)$/);
  if (m) return { view: 'day', pid: 'three-split-60', day: +m[1] };
  const last = lastPid();
  return last ? { view: 'program', pid: last } : { view: 'programs' };
}
function go(hash) { if (location.hash === '#' + hash) { route = parseHash(); render(true); } else location.hash = hash; }
let navDepth = 0; // exercise pages opened from inside the app go back with history.back()
window.addEventListener('hashchange', () => { route = parseHash(); render(true); });
const dayHash = (pid, n) => `p-${pid}-d${n}`;

/* ---------------- helpers ---------------- */
const prog = () => PBYID[route.pid] || PROGRAMS[0];
const typesOf = (p) => p.dayTypes || TYPES;
const itemSets = (b, it) => it.sets || b.sets;
const fmtFormat = { straight: 'Straight sets', superset: 'Supersets', circuit: 'Circuits', emom: 'EMOM', amrap: 'AMRAP', tabata: 'Tabata', ladder: 'Ladders' };
function nextDay(p) { const d = p.days.find((w) => !store.isDone(p.id, w.day)); return d ? d.day : null; }
function unitText(e, n) {
  if (e.u === 'sec') return e.side ? 'sec each side' : 'seconds';
  if (e.side) return 'each side';
  if (e.alt) return 'total, alternating';
  return 'reps';
}
function cycleDays(p, key) {
  const d = p.days.filter((w) => w.type === key).slice(0, 3).map((w) => w.day);
  return d.length ? `Days ${d.join(', ')}…` : '';
}
function restsOf(p) { return Object.assign({ set: 30, exercise: 60, beforeAbs: 120, superset: 45, round: 60, block: 60 }, p.rests || {}); }

/* ---------------- programs page ---------------- */
const SUBJECT_ORDER = ['Signature', 'Strength', 'Pull-ups', 'Legs & glutes', 'Kettlebell only', 'Conditioning', 'Mobility & core', 'Bodyweight', 'Busy week'];
const LENGTHS = [['all', 'Any length'], ['short', 'Up to 25 min'], ['mid', '26–32 min'], ['long', '33 min +']];
const filters = { subject: 'all', len: 'all' };
const lenOf = (p) => { const m = (p.minutes[0] + p.minutes[1]) / 2; return m <= 25.5 ? 'short' : m <= 32.5 ? 'mid' : 'long'; };
function viewPrograms() {
  const last = lastPid();
  const subjects = SUBJECT_ORDER.filter((s) => PROGRAMS.some((p) => p.subject === s));
  const shown = PROGRAMS.filter((p) => (filters.subject === 'all' || p.subject === filters.subject) && (filters.len === 'all' || lenOf(p) === filters.len));
  const card = (p) => {
    const n = store.count(p.id), mins = p.minutes[0] === p.minutes[1] ? p.minutes[0] : `${Math.round(p.minutes[0])}–${Math.round(p.minutes[1])}`;
    return `<button class="pcard${p.id === last ? ' current' : ''}" data-open-prog="${p.id}">
      <div class="pc-main">${p.id === last ? '<span class="eyebrow cur">Current program</span>' : ''}<b>${esc(p.name)}</b><p>${esc(p.blurb)}</p>
        <div class="pc-tags"><span class="chip">${esc(p.split)}</span><span class="chip">~${mins} min</span>${(p.formats || ['straight']).map((f) => `<span class="chip">${fmtFormat[f]}</span>`).join('')}${p.equip === 'kb' ? '<span class="chip">Kettlebell only</span>' : p.equip === 'bw' ? '<span class="chip">No equipment</span>' : ''}</div></div>
      <div class="pc-prog"><span class="num">${n}/${p.days.length}</span><div class="bar"><b style="width:${(n / p.days.length) * 100}%"></b></div></div></button>`;
  };
  const groups = subjects.map((s) => { const list = shown.filter((p) => p.subject === s); return list.length ? `<section class="pgroup"><h2>${esc(s)}</h2><div class="plist">${list.map(card).join('')}</div></section>` : ''; }).join('');
  return `<div class="eyebrow">${PROGRAMS.length} programs · 60 days each</div><h1>Programs</h1>
    <p class="lede">Every program starts at intermediate and ends each workout with abs, with a matched warm-up and cool-down. Progress is kept per program.</p>
    <div class="filters" role="group" aria-label="Filter by subject"><button class="fchip" data-filter="subject:all" aria-pressed="${filters.subject === 'all'}">All</button>${subjects.map((s) => `<button class="fchip" data-filter="subject:${esc(s)}" aria-pressed="${filters.subject === s}">${esc(s)}</button>`).join('')}</div>
    <div class="filters" role="group" aria-label="Filter by length">${LENGTHS.map(([k, l]) => `<button class="fchip" data-filter="len:${k}" aria-pressed="${filters.len === k}">${l}</button>`).join('')}</div>
    ${groups || '<p class="lede" style="margin-top:24px">No programs match these filters.</p>'}`;
}

/* ---------------- program page ---------------- */
function viewProgram() {
  const p = prog(), n = store.count(p.id), nx = nextDay(p), TY = typesOf(p);
  rememberPid(p.id);
  const nw = nx ? p.days[nx - 1] : null;
  const levels = [0, 1, 2].map((li) => {
    const ds = p.days.filter((w) => w.level === li + 1);
    const done = ds.filter((w) => store.isDone(p.id, w.day)).length;
    return `<section class="level"><header><h2>${esc(p.levels[li])}</h2><p>Days ${ds[0].day}–${ds[ds.length - 1].day} · ${done}/${ds.length} done</p></header>
    <div class="grid">${ds.map((w) => {
      const t = TY[w.type] || { short: w.title, c: 'var(--muted)' }, isD = store.isDone(p.id, w.day);
      return `<div class="tile${isD ? ' done' : ''}${w.day === nx ? ' next' : ''}">
        <button class="open" data-day="${w.day}" aria-label="Day ${w.day}, ${esc(w.name)}, ${esc(t.label || w.title)}${isD ? ', done' : ''}">
          <span class="n num">${w.day}</span><span class="nm">${esc(w.name)}</span>
          <span class="ty"><i class="dot" style="--c:${t.c}"></i>${esc(t.short)} · ${w.est}′</span>
        </button>
        <button class="chk" data-toggle="${w.day}" role="checkbox" aria-checked="${isD}" aria-label="Mark day ${w.day} done">${CHECK}</button>
      </div>`;
    }).join('')}</div></section>`;
  }).join('');
  const mins = p.minutes ? `~${Math.round(p.minutes[0])}–${Math.round(p.minutes[1])} min` : '';
  return `<div class="crumbs"><button class="back" data-go="programs">← All programs</button></div>
    <div class="phead"><div><div class="eyebrow">${esc(p.subject || 'Program')} · ${esc(p.split || '')} ${mins ? '· ' + mins : ''}</div><h1>${esc(p.name)}</h1><p class="lede">${esc(p.blurb)}</p>
      ${p.gear ? `<p class="gear">${esc(p.gear)}</p>` : ''}</div>
    <div class="progress"><div class="big num">${n}<small> / ${p.days.length} days</small></div><div class="bar"><b style="width:${(n / p.days.length) * 100}%"></b></div></div></div>
  <div class="cycle">${Object.entries(TY).map(([k, t]) => `<div><i class="dot" style="--c:${t.c}"></i><b>${esc(t.label)}</b><span class="days">${cycleDays(p, k)}</span></div>`).join('')}</div>
  ${nw ? `<div class="nextup"><div class="t"><span class="eyebrow">Next up · Day ${nw.day}</span><b>${esc(nw.name)}</b><span>${esc((TY[nw.type] || {}).label || nw.title)} · about ${nw.est} min</span></div><button class="btn" data-day="${nw.day}">Open workout</button></div>`
       : `<div class="nextup"><div class="t"><b>All ${p.days.length} days done</b><span>That's the full program.</span></div></div>`}
  ${levels}`;
}

/* ---------------- workout page ---------------- */
// session: per-block progress for the open day. straight: sets per item; superset: sets per pair;
// circuit: rounds done; timed formats (emom/amrap/tabata/ladder): done flag + amrap rounds / ladder rungs
const session = { key: null, blocks: [], warm: false, cool: false };
function ensureSession(p, w) {
  const key = p.id + ':' + w.day;
  if (session.key === key) return;
  session.key = key; session.warm = false; session.cool = false;
  session.blocks = w.blocks.map((b) => {
    const f = b.format || 'straight';
    if (f === 'straight') return { f, sets: b.items.map(() => 0) };
    if (f === 'superset') return { f, sets: Array.from({ length: Math.ceil(b.items.length / 2) }, () => 0) };
    if (f === 'circuit') return { f, rounds: 0 };
    return { f, done: false, count: 0 };
  });
}
function blockDone(b, s) {
  if (s.f === 'straight') return b.items.every((it, i) => s.sets[i] >= itemSets(b, it));
  if (s.f === 'superset') return s.sets.every((k) => k >= b.sets);
  if (s.f === 'circuit') return s.rounds >= b.rounds;
  return s.done;
}
function noteChip(it) { return it.note ? `<span class="notechip">${esc(it.note)}</span>` : ''; }
function exCard(it, i, bi, opts = {}) {
  const e = EX[it.ex], b = opts.block, s = opts.state;
  const sets = b ? itemSets(b, it) : 0, done = s && s.f === 'straight' ? s.sets[i] : 0;
  const count = opts.count || `<b class="num">${it.n}</b><span>${unitText(e, it.n)}</span>`;
  const pips = s && s.f === 'straight' ? `<div class="pips" role="group" aria-label="Sets of ${esc(e.name)} done"><span class="lbl">Sets</span>${Array.from({ length: sets }, (_, k) =>
    `<button class="pip num${done > k ? ' on' : ''}" data-pip="${bi}:${i}:${k + 1}" aria-pressed="${done > k}" aria-label="Set ${k + 1} of ${esc(e.name)} done">${k + 1}</button>`).join('')}</div>` : '';
  const work = s && s.f === 'straight' && e.u === 'sec' && done < sets ? `<button class="workbtn" data-work="${bi}:${i}">▶ Start set ${done + 1} · ${it.n} s${e.side ? ' each side' : ''}</button>` : '';
  return `<article class="ex${s && s.f === 'straight' && done >= sets ? ' fin' : ''}"><div class="ord">${opts.label || String(i + 1).padStart(2, '0')}${s && s.f === 'straight' ? ` · ${sets} sets` : ''}</div>
    <button class="exlink" data-ex="${it.ex}" aria-label="${esc(e.name)}: how to and muscles worked"><div class="figbox">${fig(it.ex)}</div>
    <div class="cnt">${count}</div><div class="nm">${esc(e.name)}</div></button>
    ${noteChip(it)}${e.load ? `<div class="ld">${esc(LOAD[e.load])}</div>` : ''}
    <p class="cue">${esc(e.cue)}</p>${work}${pips}</article>`;
}
function roundPips(bi, total, done, what) {
  return `<div class="pips blockpips" role="group" aria-label="${what} done"><span class="lbl">${what}</span>${Array.from({ length: total }, (_, k) =>
    `<button class="pip num${done > k ? ' on' : ''}" data-rpip="${bi}:${k + 1}" aria-pressed="${done > k}" aria-label="${what.replace(/s$/, '')} ${k + 1} done">${k + 1}</button>`).join('')}</div>`;
}
function blockHTML(p, w, b, bi) {
  const R = restsOf(p), s = session.blocks[bi], f = b.format || 'straight';
  const letter = b.kind === 'abs' ? 'Abs' : String(bi + 1);
  let desc = '', body = '', side = '';
  if (f === 'straight') {
    const sets = [...new Set(b.items.map((it) => itemSets(b, it)))];
    desc = `${b.items.length} exercises · ${sets.join('/')} sets each · ${R.set} s between sets · ${R.exercise / 60} min between exercises`;
    body = `<div class="exgrid">${b.items.map((it, i) => exCard(it, i, bi, { block: b, state: s })).join('')}</div>`;
  } else if (f === 'superset') {
    desc = `Pairs: do the two back to back, then rest ${R.superset} s · ${b.sets} rounds per pair · ${R.exercise / 60} min between pairs`;
    const pairs = [];
    for (let i = 0; i < b.items.length; i += 2) pairs.push([b.items[i], b.items[i + 1]].filter(Boolean));
    body = pairs.map((pair, pi) => `<div class="pair"><div class="pairhead"><b>Pair ${LETTERS[pi]}</b>${roundPips(bi + ':' + pi, b.sets, s.sets[pi], 'Rounds')}</div>
      <div class="exgrid">${pair.map((it, j) => exCard(it, pi * 2 + j, bi, { label: `${LETTERS[pi]}${j + 1}` })).join('')}</div></div>`).join('');
  } else if (f === 'circuit') {
    desc = `One after another with no rest · ${b.rounds} rounds · ${R.round / 60} min rest between rounds`;
    side = roundPips(bi, b.rounds, s.rounds, 'Rounds');
    body = `<div class="exgrid">${b.items.map((it, i) => exCard(it, i, bi)).join('')}</div>`;
  } else if (f === 'emom') {
    desc = `Every minute on the minute for ${b.minutes} min: do the reps, rest until the next minute. The exercise changes each minute.`;
    side = runButton(bi, s, `EMOM · ${b.minutes} min`);
    body = `<div class="exgrid">${b.items.map((it, i) => exCard(it, i, bi, { label: `Min ${i + 1}, ${i + 1 + b.items.length}…`, count: `<b class="num">${it.n}</b><span>${EX[it.ex].u === 'sec' ? 'sec' : 'reps'} per minute${EX[it.ex].side && EX[it.ex].u !== 'sec' ? ', each side' : ''}</span>` })).join('')}</div>`;
  } else if (f === 'amrap') {
    desc = `As many rounds as possible in ${b.minutes} min, moving steadily. Tap + after each round.`;
    side = runButton(bi, s, `AMRAP · ${b.minutes} min`) + counter(bi, s.count, 'Rounds');
    body = `<div class="exgrid">${b.items.map((it, i) => exCard(it, i, bi, { count: `<b class="num">${it.n}</b><span>${EX[it.ex].u === 'sec' ? 'sec' : 'reps'} per round</span>` })).join('')}</div>`;
  } else if (f === 'tabata') {
    desc = `${b.tabatas} × 4 min: 20 s as hard as you can, 10 s rest, 8 rounds, exercises rotate. 1 min between Tabatas. The timer runs it all.`;
    side = runButton(bi, s, `Tabata · ${b.tabatas * 4} min`);

  } else if (f === 'ladder') {

    side = runButton(bi, s, `Ladder · ${b.minutes} min`) + counter(bi, s.count, 'Rungs');

/* ---------------- exercise page + library ---------------- */
function usesEx(w, id) { return [...w.blocks.flatMap((b) => b.items), ...(w.warmup ? w.warmup.items : []), ...(w.cooldown ? w.cooldown.items : [])].some((it) => it.ex === id); }

function viewLibrary() {

  ${cats.map((c) => { const list = Object.values(EX).filter((e) => e.cat === c); return list.length ? `<section class="libcat"><h2>${CAT[c]}</h2><div class="exgrid">${list.map((e) => `<article class="ex"><button class="exlink" data-ex="${e.id}" aria-label="${esc(e.name)}: how to and muscles worked"><div class="figbox">${fig(e.id)}</div><div class="nm">${esc(e.name)}</div></button>${e.load ? `<div class="ld">${esc(LOAD[e.load])}</div>` : ''}<p class="cue">${esc(e.cue)}</p></article>`).join('')}</div></section>` : ''; }).join('')}`;

function render(scrollTop) {
  const app = $('#app');
  const v = route.view;
  app.innerHTML = v === 'programs' ? viewPrograms() : v === 'library' ? viewLibrary() : v === 'exercise' ? viewExercise() : v === 'day' ? viewDay() : viewProgram();
  document.querySelectorAll('.nav button').forEach((b) => b.setAttribute('aria-current', (b.dataset.go === 'library' ? (v === 'library' || v === 'exercise') : (v !== 'library' && v !== 'exercise')) ? 'page' : 'false'));
  const showTimer = v === 'day';
  $('#timer').hidden = !showTimer; document.body.classList.toggle('has-timer', showTimer);
  if (scrollTop) window.scrollTo(0, 0);
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('button'); if (!el) return;
  const d = el.dataset;
  if (el.id === 'brand') return go('programs');
  if (d.go === 'programs') return go('programs');
  if (d.go === 'library') return go('exercises');
  if (d.go === 'program') return go('p-' + prog().id);
  if (d.openProg) return go('p-' + d.openProg);
  if (d.filter) { const [k, v] = d.filter.split(':'); filters[k] = v; render(); return; }
  if (d.toggle) { store.toggle(prog().id, +d.toggle); return; }
  if (d.day) { const n = +d.day; if (n >= 1 && n <= prog().days.length) go(dayHash(prog().id, n)); return; }
  if (d.pip) { onPip(d.pip); return; }
  if (d.rpip) { onRoundPip(d.rpip); return; }
  if (d.work) { const [bi, i] = d.work.split(':').map(Number); startWork(bi, i); return; }
  if (d.run) { runBlock(+d.run); return; }
  if (d.count) { const [bi, delta] = d.count.split(':').map(Number); const s = session.blocks[bi]; s.count = Math.max(0, s.count + delta); rerender(); return; }
  if (d.ex) { navDepth++; return go('ex-' + d.ex); }
  if (d.back) { if (navDepth > 0) { navDepth--; history.back(); } else go('exercises'); return; }
  if (d.stretch) { runStretches(d.stretch); return; }
});

/* ---------------- sets, rounds and rests ---------------- */
const curDay = () => prog().days[route.day - 1];
function runStretches(key) {
  const w = curDay(), b = key === 'warm' ? w.warmup : w.cooldown;
  const phases = [];
  b.items.forEach((it, i) => {
    const e = EX[it.ex], sub = `${b.title} · ${i + 1} of ${b.items.length}`, last = i === b.items.length - 1;
    phases.push({ sec: 3, label: `${i ? 'Next' : 'Get ready'} · ${e.name}`, sub, end: 'short' });
    if (e.side) phases.push(
      { sec: it.n, label: `${e.name} · first side`, sub, end: 'short', work: 1 },
      { sec: 3, label: 'Switch sides', sub, end: 'short' },
      { sec: it.n, label: `${e.name} · second side`, sub, end: last ? 'long' : 'short', work: 1 });
    else phases.push({ sec: it.n, label: e.name, sub, end: last ? 'long' : 'short', work: 1 });
  });
  phases[phases.length - 1].onEnd = () => {
    session[key] = true; T.setLabel(key === 'warm' ? 'Warm-up done' : 'Cool-down done', key === 'warm' ? 'Start the first exercise' : 'Workout complete'); rerender();
  };
  T.unlockAudio(); if (key === 'warm') S.start(); T.run(phases);
}
// rest after a whole block: 1 min to the next block, 2 min before the abs, nothing after the last
function afterBlock(bi) {
  const p = prog(), R = restsOf(p), w = curDay(), next = w.blocks[bi + 1];
  if (next) T.start(next.kind === 'abs' ? R.beforeAbs : R.block, `Rest · ${next.kind === 'abs' ? 'abs' : next.title.toLowerCase()} next`, `First: ${EX[next.items[0].ex].name}`);
  else { T.clear(); T.setLabel('Workout finished', w.cooldown ? 'Time for the cool-down stretches' : 'Every set is done'); }
}
function onPip(v) {
  const [bi, i, k] = v.split(':').map(Number);
  const s = session.blocks[bi];
  s.sets[i] = s.sets[i] === k ? k - 1 : k;
  if (s.sets[i] >= k) { T.clear(); afterSet(bi, i, k); }
  rerender();
}
function afterSet(bi, i, k) {
  const p = prog(), R = restsOf(p), b = curDay().blocks[bi], it = b.items[i], sets = itemSets(b, it);
  T.unlockAudio(); S.start();
  const name = EX[it.ex].name;
  if (k < sets) T.start(R.set, `Rest · set ${k + 1} of ${sets} next`, name);
  else if (i < b.items.length - 1) { const nx = b.items[i + 1]; T.start(R.exercise, `Rest · next: ${EX[nx.ex].name}`, `${nx.n} ${unitText(EX[nx.ex])} × ${itemSets(b, nx)} sets`); }
  else afterBlock(bi);
}
// superset pairs ("bi:pair") and circuit rounds ("bi")
function onRoundPip(v) {
  const parts = v.split(':').map(Number), bi = parts[0], k = parts[parts.length - 1];
  const p = prog(), R = restsOf(p), b = curDay().blocks[bi], s = session.blocks[bi];
  T.unlockAudio(); S.start();
  if (s.f === 'superset') {
    const pi = parts[1];
    s.sets[pi] = s.sets[pi] === k ? k - 1 : k;
    if (s.sets[pi] >= k) {
      T.clear();
      const pairs = Math.ceil(b.items.length / 2);
      if (k < b.sets) T.start(R.superset, `Rest · pair ${LETTERS[pi]}, round ${k + 1} of ${b.sets} next`, b.items.slice(pi * 2, pi * 2 + 2).map((it) => EX[it.ex].name).join(' + '));
      else if (pi < pairs - 1) T.start(R.exercise, `Rest · pair ${LETTERS[pi + 1]} next`, b.items.slice(pi * 2 + 2, pi * 2 + 4).map((it) => EX[it.ex].name).join(' + '));
      else afterBlock(bi);
    }
  } else {
    s.rounds = s.rounds === k ? k - 1 : k;
    if (s.rounds >= k) {
      T.clear();
      if (k < b.rounds) T.start(R.round, `Rest · round ${k + 1} of ${b.rounds} next`, b.title);
      else afterBlock(bi);
    }
  }
  rerender();
}
// timed blocks run hands-free on the timer
function runBlock(bi) {
  const p = prog(), R = restsOf(p), b = curDay().blocks[bi], s = session.blocks[bi], f = b.format;
  const nm = (it) => EX[it.ex].name;
  const finish = () => { s.done = true; afterBlock(bi); rerender(); };
  const phases = [{ sec: 3, label: `Get ready · ${b.title}`, sub: fmtFormat[f], end: 'short' }];
  if (f === 'emom') {
    for (let m = 1; m <= b.minutes; m++) {
      const it = b.items[(m - 1) % b.items.length], e = EX[it.ex];
      phases.push({ sec: 60, label: `Min ${m}/${b.minutes} · ${nm(it)} × ${it.n}${e.u === 'sec' ? ' s' : ''}${e.side ? ' each side' : ''}`, sub: 'Do the reps, rest until the beep', end: m < b.minutes ? 'short' : 'long', work: 1 });
    }
  } else if (f === 'tabata') {
    for (let t = 0; t < b.tabatas; t++) {
      for (let r = 0; r < 8; r++) {
        const it = b.items[(t * 8 + r) % b.items.length], nx = b.items[(t * 8 + r + 1) % b.items.length];
        phases.push({ sec: 20, label: `${nm(it)} · go hard`, sub: `Tabata ${t + 1}/${b.tabatas} · round ${r + 1}/8`, end: 'short', work: 1 });
        if (r < 7) phases.push({ sec: 10, label: `Rest · next ${nm(nx)}`, sub: `Tabata ${t + 1}/${b.tabatas}`, end: 'short' });
      }
      if (t < b.tabatas - 1) phases.push({ sec: R.block, label: 'Rest · next Tabata', sub: `${b.tabatas - t - 1} to go`, end: 'short' });
    }
    phases[phases.length - 1].end = 'long';
  } else {
    phases.push({ sec: b.minutes * 60, label: f === 'amrap' ? `AMRAP · ${b.items.map(nm).join(' → ')}` : `Ladder · ${b.items.map(nm).join(' + ')}`, sub: f === 'amrap' ? 'Tap + after each round' : '1 rep, then 2, then 3… tap + after each rung', end: 'long', work: 1 });
  }

// timed exercise: 3 s get-ready, the hold (each side if needed), beep, then tick the set and start the rest
function startWork(bi, i) {
  const b = curDay().blocks[bi], it = b.items[i], e = EX[it.ex], s = session.blocks[bi], sets = itemSets(b, it);
  const k = s.sets[i] + 1; if (k > sets) return;
  const sub = `Set ${k} of ${sets}`;
  const finish = () => { s.sets[i] = Math.max(s.sets[i], k); afterSet(bi, i, k); rerender(); };
  const phases = [{ sec: 3, label: `Get ready · ${e.name}`, sub, end: 'short' }];
  if (e.side) phases.push(
    { sec: it.n, label: `${e.name} · first side`, sub, end: 'long', work: 1 },
    { sec: 5, label: 'Switch sides', sub, end: 'short' },
    { sec: it.n, label: `${e.name} · second side`, sub, end: 'long', work: 1, onEnd: finish });
  else phases.push({ sec: it.n, label: e.name, sub, end: 'long', work: 1, onEnd: finish });
  T.unlockAudio(); S.start(); T.run(phases);
}

const T = {
  dur: 30, left: 30, running: false, endAt: 0, iv: null, ctx: null, lock: null,
  fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); },
  setLabel(a, b) { $('#tlabel').textContent = a; $('#tsub').textContent = b; },
  paint() {
    $('#tclock').textContent = this.fmt(this.left);
    $('#tclock').classList.toggle('zero', this.left <= 0);
    $('#tgo').textContent = this.running ? 'Pause' : (this.left > 0 && this.left < this.dur ? 'Resume' : 'Start');
    document.querySelectorAll('#presets button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.preset === this.dur)));
  },
  unlockAudio() {
    try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {}
  },
  beep(kind) {
    const long = kind !== 'short';
    try {
      const c = this.ctx; if (!c) return;

      // triangle carries better than sine at the same level; a short hold at the peak adds presence
      o.type = 'triangle'; o.frequency.value = long ? 880 : 1320; o.connect(g); g.connect(c.destination);
      const len = long ? 0.75 : 0.18, peak = long ? 0.75 : 0.5, t0 = c.currentTime;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);
      g.gain.setValueAtTime(peak, t0 + len * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      o.start(t0); o.stop(t0 + len + 0.05);
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(long ? 300 : 80); } catch (e) {}
  },
  async wake(on) {
    try { if (on && !this.lock && navigator.wakeLock) this.lock = await navigator.wakeLock.request('screen'); if (!on && this.lock) { await this.lock.release(); this.lock = null; } } catch (e) { this.lock = null; }
  },
  queue: [], phase: null,
  tick() {
    if (!this.running) return;
    this.left = (this.endAt - Date.now()) / 1000;
    if (this.left <= 0) {
      this.left = 0; this.running = false; clearInterval(this.iv);
      const ph = this.phase || { end: 'long' };
      this.beep(ph.end);
      const next = this.queue.shift();
      if (next) { this.begin(next); return; }
      this.phase = null;
      $('#timer').classList.remove('work');
      this.setLabel('Go', ph.work ? 'Done' : 'Rest is over, start the next set');
      if (ph.onEnd) ph.onEnd();
    }
    this.paint();
  },
  begin(ph) {
    this.phase = ph; this.dur = ph.sec; this.left = ph.sec;
    this.setLabel(ph.label, ph.sub || '');
    $('#timer').classList.toggle('work', !!ph.work);
    this.go();
  },
  run(phases) { this.queue = phases.slice(1); this.begin(phases[0]); },
  go() {
    if (this.left <= 0) this.left = this.dur;
    this.running = true; this.endAt = Date.now() + this.left * 1000;
    clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 200);
    this.wake(true); this.paint();
  },
  start(sec, label, sub) {
    if (sec) { this.run([{ sec, label, sub, end: 'long' }]); return; }
    if (!this.phase) this.phase = { sec: this.dur, end: 'long' };
    const l = $('#tlabel').textContent;
    if (l === 'Go' || l === 'Rest timer' || l === 'Workout finished') this.setLabel('Rest', 'Counting down');
    this.go();
  },
  clear() { this.queue = []; this.phase = null; this.running = false; clearInterval(this.iv); $('#timer').classList.remove('work'); this.left = this.dur; this.paint(); },

const S = {
  startAt: 0, iv: null,

  reset() { this.startAt = 0; clearInterval(this.iv); this.paint(); },
  paint() { const s = this.startAt ? (Date.now() - this.startAt) / 1000 : 0; $('#sess').textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); },
};
$('#presets').innerHTML = [[30, '30s'], [45, '45s'], [60, '1 min'], [90, '1:30'], [120, '2 min']].map(([s, l]) => `<button data-preset="${s}" aria-pressed="false">${l}</button>`).join(' ');
$('#presets').addEventListener('click', (e) => { const b = e.target.closest('[data-preset]'); if (b) T.preset(+b.dataset.preset); });
document.querySelectorAll('[data-adj]').forEach((b) => b.addEventListener('click', () => T.adjust(+b.dataset.adj)));
const toggleTimer = () => { T.unlockAudio(); S.start(); if (T.running) T.pause(); else T.start(); };
$('#tgo').addEventListener('click', toggleTimer);
$('#tclock').addEventListener('click', toggleTimer);
$('#treset').addEventListener('click', () => { T.clear(); T.setLabel('Rest timer', 'Tap a set number when you finish a set'); });
$('#sessreset').addEventListener('click', () => S.reset());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T.running) { T.lock = null; T.wake(true); } });

/* ---------------- boot ---------------- */
route = parseHash();
store.loadLocal();
render();
T.paint();
store.init();

</script>
